# After seed.yaml (Spanish, pesos): a $3.500.000 salary, a $4.800.000 motorbike
# loan with its $320.000 installment paid, and limits on Café ($60.000),
# Domicilio ($80.000) and Mercado ($600.000) (3 is the free plan's limit).
appId: com.sotico91.rumi
---
- tapOn: "Inicio"
- tapOn: { id: "add-fab" }
- tapOn: "Ingreso"
- tapOn: { id: "flow-amount" }
- inputText: "3500000"
- tapOn: "¿De cuánto fue?"
- tapOn: "Continuar"
- tapOn: "Salario"
- tapOn: "Continuar"
- tapOn: "Continuar"
- tapOn: "Sí, guardar"
- extendedWaitUntil: { visible: "Inicio", timeout: 10000 }
- tapOn: "Patrimonio"
- scrollUntilVisible: { element: "Agregar crédito" }
- tapOn: "Agregar crédito"
- tapOn: { id: "debt-name" }
- inputText: "Moto"
- tapOn: "Saldo que aún debes"
- tapOn: { id: "debt-balance" }
- inputText: "4800000"
- tapOn: "Saldo que aún debes"
- tapOn: { below: "Cuota mensual fija" }
- inputText: "320000"
- tapOn: "Saldo que aún debes"
- scroll
- tapOn: "Guardar"
- tapOn: { text: "Permitir", optional: true }
- tapOn: "Pagar cuota"
- tapOn: "¿De cuánto fue?"
- repeat:
    while: { notVisible: "Sí, guardar" }
    times: 4
    commands:
      - tapOn: "Continuar"
      - waitForAnimationToEnd
- tapOn: "Sí, guardar"
- extendedWaitUntil: { visible: "Patrimonio", timeout: 10000 }
- tapOn: "Plan"
- tapOn: "Mis conceptos de gasto.*"
- tapOn: "Alimentación.*subcategorías.*"
- tapOn: { text: ".*Definir.*", index: 0 }
- inputText: "60000"
- tapOn: "Tope al mes"
- tapOn: { text: "Guardar", index: 0 }
- waitForAnimationToEnd
- tapOn: { text: ".*Definir.*", index: 0 }
- inputText: "80000"
- tapOn: "Tope al mes"
- tapOn: { text: "Guardar", index: 0 }
- waitForAnimationToEnd
- tapOn: { text: ".*Definir.*", index: 0 }
- inputText: "600000"
- tapOn: "Tope al mes"
- tapOn: { text: "Guardar", index: 0 }
- waitForAnimationToEnd
