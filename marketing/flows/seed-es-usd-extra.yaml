# After seed-es-usd.yaml: a $3,200 salary, a $3,800 car loan with its $389
# installment paid, and limits on Café ($30), Domicilio ($60) and Mercado ($350)
# (3 is the free plan's limit).
appId: com.sotico91.rumi
---
- tapOn: "Inicio"
- tapOn: { id: "add-fab" }
- tapOn: "Ingreso"
- tapOn: { id: "flow-amount" }
- inputText: "3200"
- tapOn: "¿De cuánto fue?"
- tapOn: "Continuar"
- tapOn: "Salario"
- tapOn: "Continuar"
- tapOn: "Continuar"
- tapOn: "Sí, guardar"
- extendedWaitUntil: { visible: "Inicio", timeout: 10000 }
- tapOn: "Patrimonio"
- scrollUntilVisible: { element: "Agregar crédito", centerElement: true }
- tapOn: "Agregar crédito"
- tapOn: { id: "debt-name" }
- inputText: "Préstamo del carro"
# The keyboard covers the labels: scroll each field into view before tapping it.
- scrollUntilVisible: { element: { id: "debt-balance" }, centerElement: true }
- tapOn: { id: "debt-balance" }
- inputText: "3800"
- scrollUntilVisible: { element: "Cuota mensual fija", centerElement: true }
- tapOn: { below: "Cuota mensual fija" }
- inputText: "389"
- scrollUntilVisible: { element: "Guardar", centerElement: true }
- tapOn: "Guardar"
- tapOn: { text: "Permitir", optional: true }
- tapOn: "Pagar cuota"
- tapOn: "¿De cuánto fue?"
- repeat:
    while: { notVisible: "Sí, guardar" }
    times: 4
    commands:
      - tapOn: "Continuar"
      - waitForAnimationToEnd
- tapOn: "Sí, guardar"
- extendedWaitUntil: { visible: "Patrimonio", timeout: 10000 }
- tapOn: "Plan"
- tapOn: "Mis conceptos de gasto.*"
- tapOn: "Alimentación.*subcategorías.*"
- tapOn: { text: ".*Definir.*", index: 0 }
- inputText: "30"
- tapOn: "Tope al mes"
- tapOn: { text: "Guardar", index: 0 }
- waitForAnimationToEnd
- tapOn: { text: ".*Definir.*", index: 0 }
- inputText: "60"
- tapOn: "Tope al mes"
- tapOn: { text: "Guardar", index: 0 }
- waitForAnimationToEnd
- tapOn: { text: ".*Definir.*", index: 0 }
- inputText: "350"
- tapOn: "Tope al mes"
- tapOn: { text: "Guardar", index: 0 }
- waitForAnimationToEnd
