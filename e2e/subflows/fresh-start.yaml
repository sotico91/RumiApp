# Fresh app data, onboarding done in Spanish: every ant spend marked (it creates
# their subcategories) and $1.000.000 in the main bank.
# CURRENCY=USD picks dollars on the currency step (default: what the phone's region says).
appId: com.sotico91.rumi
---
- launchApp:
    clearState: true
    stopApp: true
# A fresh install can show iOS's notification prompt over the first step.
- tapOn:
    text: "Permitir"
    optional: true
- extendedWaitUntil:
    visible: "Tu nombre"
    timeout: 20000
- tapOn: "Tu nombre"
- inputText: "Prueba"
- tapOn: "Suena bien"
- runFlow:
    when:
      true: ${typeof CURRENCY !== 'undefined' && CURRENCY === 'USD'}
    commands:
      - tapOn: "Dólares \\(USD\\)"
- tapOn: "Continuar"
- tapOn: ".*Café"
- tapOn: ".*Domicilio"
- tapOn: ".*Snack"
- tapOn: ".*Taxi y apps"
- tapOn: ".*Suscripciones"
- tapOn: "Continuar"
- assertVisible: "¿Cuánta plata tienes hoy?"
- tapOn:
    id: "onboard-bank"
- inputText: "1000000"
- tapOn: "PASO 4 DE 4"
- tapOn: "Listo, vamos"
# The first-launch tips cover Home for about 18 s (the last one, Settings and
# security, stays 10 s) and close on their own.
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 25000
